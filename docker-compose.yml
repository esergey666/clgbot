services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: clg-telegram-bot-api
    restart: unless-stopped
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clg-label-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OCR_ENGINE: "${OCR_ENGINE:-rapidocr}"
      TELEGRAM_API_BASE: "${TELEGRAM_API_BASE:-}"
    volumes:
      - ./data:/app/data
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telegram-bot-api-data:
